name: Verify offline experiment workspaces
on:
  push:
    branches: [main]
    paths:
      - 'experiment_tools/**'
      - 'cli_adapters/**'
      - 'scripts/engineering.py'
      - 'engineering/**'
      - '.github/workflows/workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-workspace-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exercise offline workspaces and adapter contracts
        run: |
          python3 -m unittest discover -s experiment_tools -p 'test_*.py' -v
          python3 -m unittest discover -s cli_adapters -p 'test_*.py' -v
