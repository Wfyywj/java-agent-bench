name: Verify offline CLI adapters
on:
  push:
    branches: [main]
    paths:
      - 'cli_adapters/**'
      - '.github/workflows/cli-adapters.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test planning, trace normalization and source collection (no agents)
        run: python3 -m unittest discover -s cli_adapters -p 'test_*.py' -v
